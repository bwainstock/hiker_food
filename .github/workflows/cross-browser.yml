name: Cross-browser diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    name: Firefox + WebKit / Manual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:cross-browser
      - name: Upload diagnostic artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
